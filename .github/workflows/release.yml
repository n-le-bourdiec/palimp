# Release (session 35). Trusted publishing (OpenID Connect): no API token is stored
# in this repository. The project lead configures the trusted publishers once, on
# PyPI (environment `pypi`) and on TestPyPI (environment `testpypi`), for this
# repository and this workflow file name.
#
# - A pushed tag `v*` (for example v0.1.0) checks, builds and publishes to PyPI. The
#   tag must match the version in pyproject.toml.
# - Started by hand from the Actions tab, it checks, builds and publishes to TestPyPI
#   only, never to PyPI.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --all-packages
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest
      - name: Check the tag matches the package version
        if: github.event_name == 'push'
        run: |
          version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
      - name: Build the analyzer only (the simulator is never published)
        run: uv build --package palimp --out-dir dist
      - name: Check the distributions hold no simulator code
        run: |
          ls dist
          for wheel in dist/*.whl; do
            if unzip -l "$wheel" | grep -q palimp_sim; then
              echo "$wheel contains simulator code"
              exit 1
            fi
          done
          for sdist in dist/*.tar.gz; do
            if tar tzf "$sdist" | grep -Eq 'palimp_sim|simulator/'; then
              echo "$sdist contains simulator code"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/palimp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/palimp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
