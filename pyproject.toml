[project]
name = "palimp"
version = "0.1.0"
description = "Offline CLI that reconstructs the lost intent behind inherited firewall rules."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "n-le-bourdiec" }]
keywords = ["firewall", "juniper", "srx", "junos", "security-policy", "audit", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Firewalls",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/n-le-bourdiec/palimp"
Repository = "https://github.com/n-le-bourdiec/palimp"
Issues = "https://github.com/n-le-bourdiec/palimp/issues"
Changelog = "https://github.com/n-le-bourdiec/palimp/blob/main/CHANGELOG.md"

[project.scripts]
palimp = "palimp.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palimp"]

# The simulator, scenarios, evaluation scripts and tests are not shipped: the
# source distribution holds the analyzer and its package data only.
[tool.hatch.build.targets.sdist]
only-include = ["src/palimp", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs/assets"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "TID251"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option", "pathlib.Path"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"palimp_sim".msg = "The analyzer never imports the simulator (decision 0009)."

[tool.uv.workspace]
members = ["simulator"]

[tool.pytest.ini_options]
testpaths = ["tests", "simulator/tests"]
addopts = "-ra --import-mode=importlib -n auto"
markers = [
    "slow: long tests, run in CI or with --runslow",
    "full: Medium seeds 10 to 99, run with --runslow only (not in CI)",
]
