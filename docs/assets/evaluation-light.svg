<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="How palimp is evaluated: a seeded simulator generates firewall histories with a hidden ground truth; palimp analyzes the artifacts and an evaluation harness scores its verdicts. Held-out scenarios run only in GitHub Actions."><title>How palimp is evaluated: a seeded simulator generates firewall histories with a hidden ground truth; palimp analyzes the artifacts and an evaluation harness scores its verdicts. Held-out scenarios run only in GitHub Actions.</title><defs><marker id="ah-def" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker></defs><rect x="30" y="120" width="200" height="130" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.2"/><text x="130" y="150" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">palimp-sim</text><text x="130" y="174" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">seeded synthetic company,</text><text x="130" y="190" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">years of firewall history,</text><text x="130" y="206" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">admins, incidents, traps</text><rect x="290" y="80" width="190" height="70" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.2"/><text x="385" y="108" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle">Artifacts</text><text x="385" y="128" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">what an engineer inherits</text><rect x="290" y="220" width="190" height="70" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="1.2"/><text x="385" y="248" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle">Ground truth</text><text x="385" y="268" font-size="11.5" font-weight="400" fill="#9a6700" text-anchor="middle">never shown to palimp</text><polyline points="230,160 260,160 260,115 288,115" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ah-def)"/><polyline points="230,210 260,210 260,255 288,255" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ah-def)"/><rect x="540" y="80" width="170" height="70" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/><text x="625" y="108" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">palimp</text><text x="625" y="128" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">same CLI users run</text><polyline points="480,115 538,115" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ah-def)"/><rect x="770" y="150" width="170" height="80" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.2"/><text x="855" y="182" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle">Evaluation harness</text><text x="855" y="202" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">compares rule by rule</text><polyline points="710,115 740,115 740,175 768,175" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ah-def)"/><text x="746" y="104" font-size="11" font-weight="400" fill="#59636e" text-anchor="start">report.json</text><polyline points="480,255 740,255 740,205 768,205" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ah-def)"/><rect x="970" y="90" width="130" height="200" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.2"/><text x="1035" y="116" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle">Metrics</text><text x="982" y="142" font-size="11" font-weight="400" fill="#59636e" text-anchor="start">verdict accuracy</text><text x="982" y="157" font-size="11" font-weight="400" fill="#59636e" text-anchor="start">vs best achievable</text><text x="982" y="172" font-size="11" font-weight="400" fill="#59636e" text-anchor="start"></text><text x="982" y="187" font-size="11" font-weight="400" fill="#59636e" text-anchor="start">live rules flagged</text><text x="982" y="202" font-size="11" font-weight="400" fill="#59636e" text-anchor="start">for removal (target 0)</text><text x="982" y="217" font-size="11" font-weight="400" fill="#59636e" text-anchor="start"></text><text x="982" y="232" font-size="11" font-weight="400" fill="#59636e" text-anchor="start">overconfidence</text><text x="982" y="247" font-size="11" font-weight="400" fill="#59636e" text-anchor="start"></text><text x="982" y="262" font-size="11" font-weight="400" fill="#59636e" text-anchor="start">vs naive baseline</text><polyline points="940,190 968,190" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ah-def)"/><rect x="30" y="340" width="520" height="100" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.2" stroke-dasharray="6 4"/><text x="50" y="368" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">Dev seeds</text><text x="50" y="390" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Run locally by the coding agent. Seeds 0-19 tune the rules,</text><text x="50" y="408" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">seeds 20-99 check for overfitting without any tuning.</text><rect x="580" y="340" width="520" height="100" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/><text x="600" y="368" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">Held-out seeds</text><text x="600" y="390" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Generated only in GitHub Actions from a secret salt the agent never sees.</text><text x="600" y="408" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Aggregate scores only, run by the project lead once per release.</text><text x="30" y="40" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">Independence: simulator and analyzer share no code, only the ground truth schema.</text></svg>