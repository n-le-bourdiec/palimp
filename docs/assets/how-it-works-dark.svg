<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="How palimp works: inherited firewall artifacts go through format readers, evidence collectors and an assessment, and come out as a report, owner questionnaires and a cleanup list, all on your machine."><title>How palimp works: inherited firewall artifacts go through format readers, evidence collectors and an assessment, and come out as a report, owner questionnaires and a cleanup list, all on your machine.</title><defs><marker id="ah-def" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4493f8"/></marker></defs><rect x="16" y="16" width="1148" height="528" rx="16" fill="none" stroke="#656c76" stroke-width="1.2" stroke-dasharray="6 4"/><text x="36" y="44" font-size="13" font-weight="600" fill="#9198a1" text-anchor="start">Runs on your machine  ·  read-only  ·  zero network egress</text><text x="44" y="92" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">Inherited artifacts</text><rect x="44" y="108" width="212" height="44" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="58" y="135" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Junos config (set format)</text><rect x="44" y="164" width="212" height="44" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="58" y="191" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Commit history + rollbacks</text><rect x="44" y="220" width="212" height="44" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="58" y="247" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Session logs (RT_FLOW)</text><rect x="44" y="276" width="212" height="44" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="58" y="303" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Hit counts</text><rect x="44" y="332" width="212" height="44" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="58" y="359" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Tickets export (CSV, optional)</text><rect x="296" y="190" width="140" height="110" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="366" y="228" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Format readers</text><text x="366" y="252" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">detect each layout,</text><text x="366" y="268" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">count unknown lines</text><polyline points="256,130 276,130 276,245 294,245" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah-def)"/><polyline points="256,186 276,186 276,245 294,245" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah-def)"/><polyline points="256,242 276,242 276,245 294,245" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah-def)"/><polyline points="256,298 276,298 276,245 294,245" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah-def)"/><polyline points="256,354 276,354 276,245 294,245" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah-def)"/><rect x="476" y="118" width="216" height="270" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="584" y="146" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Evidence collectors</text><rect x="490" y="162" width="188" height="46" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="502" y="181" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="start">T1 direct</text><text x="502" y="198" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">descriptions, commits, tickets</text><rect x="490" y="216" width="188" height="46" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="502" y="235" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="start">T2 behavioral</text><text x="502" y="252" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">logs, hit counts: seen or blind</text><rect x="490" y="270" width="188" height="46" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="502" y="289" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="start">T3 structural</text><text x="502" y="306" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">objects, history, sibling rules</text><rect x="490" y="324" width="188" height="46" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="502" y="343" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="start">T4 contextual</text><text x="502" y="360" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">well-known ports and apps</text><polyline points="436,245 474,245" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah-def)"/><rect x="732" y="140" width="196" height="210" rx="10" fill="#0d2d55" stroke="#4493f8" stroke-width="1.6"/><text x="830" y="168" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Assessment</text><text x="746" y="194" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="start">Verdict: keep, verify or</text><text x="746" y="211" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="start">removal candidate</text><text x="746" y="228" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="start">Confidence: HIGH, MEDIUM</text><text x="746" y="245" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="start">or LOW, owner to ask,</text><text x="746" y="262" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="start">conflicts flagged</text><rect x="744" y="286" width="172" height="48" rx="8" fill="#151b23" stroke="#4493f8" stroke-width="1.2"/><text x="830" y="306" font-size="11.5" font-weight="600" fill="#4493f8" text-anchor="middle">Never removal from</text><text x="830" y="321" font-size="11.5" font-weight="600" fill="#4493f8" text-anchor="middle">missing traffic alone</text><polyline points="692,245 730,245" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah-def)"/><text x="960" y="132" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">Outputs</text><rect x="960" y="148" width="186" height="52" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="970" y="170" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="start">Owner questionnaires</text><text x="970" y="187" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">one email per person</text><polyline points="928,245 944,245 944,174 958,174" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah-def)"/><rect x="960" y="212" width="186" height="52" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="970" y="234" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="start">Firewall team cleanup</text><text x="970" y="251" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">deactivated rules</text><polyline points="928,245 944,245 944,238 958,238" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah-def)"/><rect x="960" y="276" width="186" height="52" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="970" y="298" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="start">report.md + report.json</text><text x="970" y="315" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">every claim cites evidence</text><polyline points="928,245 944,245 944,302 958,302" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah-def)"/><rect x="732" y="420" width="196" height="76" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.2" stroke-dasharray="6 4"/><text x="830" y="446" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">Local LLM writer</text><text x="830" y="464" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">optional, off by default</text><text x="830" y="482" font-size="11" font-weight="400" fill="#9198a1" text-anchor="middle">Ollama on localhost only</text><polyline points="830,350 830,418" fill="none" stroke="#9198a1" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-def)"/><text x="840" y="388" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">facts only</text><rect x="960" y="420" width="186" height="76" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.2" stroke-dasharray="6 4"/><text x="1053" y="444" font-size="11.5" font-weight="400" fill="#e6edf3" text-anchor="middle">Validator</text><text x="1053" y="460" font-size="11.5" font-weight="400" fill="#e6edf3" text-anchor="middle">uncited claims</text><text x="1053" y="476" font-size="11.5" font-weight="400" fill="#e6edf3" text-anchor="middle">are dropped</text><polyline points="928,458 958,458" fill="none" stroke="#9198a1" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-def)"/><polyline points="1053,420 1053,331" fill="none" stroke="#9198a1" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-def)"/><line x1="44" y1="470" x2="84" y2="470" stroke="#9198a1" stroke-width="1.5"/><text x="92" y="474" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">always on</text><line x1="170" y1="470" x2="210" y2="470" stroke="#9198a1" stroke-width="1.5" stroke-dasharray="5 4"/><text x="218" y="474" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">optional</text><text x="44" y="504" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">Each rule ends with a probable intent, its ranked evidence, a confidence,</text><text x="44" y="521" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">a verdict and the question to ask its owner.</text></svg>