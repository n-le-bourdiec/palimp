<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="How palimp was built: a chat Claude acting as technical lead writes one-mission prompts, the project lead challenges and relays them, Claude Code develops in a fresh conversation per session, and the repository holds the project memory."><title>How palimp was built: a chat Claude acting as technical lead writes one-mission prompts, the project lead challenges and relays them, Claude Code develops in a fresh conversation per session, and the repository holds the project memory.</title><defs><marker id="ah-def" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4493f8"/></marker></defs><rect x="30" y="60" width="280" height="140" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="50" y="92" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">Claude (chat)</text><text x="50" y="112" font-size="12" font-weight="600" fill="#9198a1" text-anchor="start">technical lead</text><text x="50" y="140" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">vision and decisions,</text><text x="50" y="157" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">one-mission prompts,</text><text x="50" y="174" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">review of every report</text><rect x="420" y="60" width="280" height="140" rx="10" fill="#0d2d55" stroke="#4493f8" stroke-width="1.6"/><text x="440" y="92" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">Nathan</text><text x="440" y="112" font-size="12" font-weight="600" fill="#4493f8" text-anchor="start">project lead</text><text x="440" y="140" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">challenges choices,</text><text x="440" y="157" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">accounts and installs,</text><text x="440" y="174" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">triggers held-out runs</text><rect x="810" y="60" width="280" height="140" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="830" y="92" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">Claude Code</text><text x="830" y="112" font-size="12" font-weight="600" fill="#9198a1" text-anchor="start">developer</text><text x="830" y="140" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">fresh conversation per</text><text x="830" y="157" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">session: code, tests,</text><text x="830" y="174" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">commits, push, metrics</text><polyline points="310,95 418,95" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah-def)"/><text x="364" y="86" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">mission prompt</text><polyline points="700,95 808,95" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah-def)"/><text x="754" y="86" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">pasted as is</text><polyline points="808,165 702,165" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah-def)"/><text x="754" y="185" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">session report</text><polyline points="418,165 312,165" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah-def)"/><text x="364" y="185" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">report + challenges</text><rect x="810" y="260" width="280" height="110" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="830" y="290" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">Repository memory</text><text x="830" y="316" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">CLAUDE.md, HANDOFF.md,</text><text x="830" y="333" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">docs/decisions/, metrics/sessions.csv</text><polyline points="910,200 910,258" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah-def)"/><text x="918" y="234" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">writes</text><polyline points="1010,258 1010,202" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah-def)"/><text x="1018" y="234" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">read first</text><text x="30" y="290" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">One mission per session, every decision recorded with its reason,</text><text x="30" y="310" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">per-session tokens and API-equivalent cost measured, never estimated.</text><text x="30" y="330" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">The agent may act on its own only in the safe direction (keep or verify).</text><text x="30" y="36" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">Nobody on the project writes code by hand: the human role is direction, challenge and checks.</text></svg>